html {
    color-scheme: light only !important;
}

body {
    background-color: black !important;
    color: white !important;
}

/* Force white background when it changes */
body.white-mode {
    background-color: white !important;
    color: black !important;
}

/* ===== BASIC SETUP ===== */
* {
    cursor: none;
    margin: 0;
    padding: 0;
    user-select: none;
}

body {
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    transition: background-color 1s ease;
    position: relative;
}

body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.5);
    z-index: 9998;
}

/* ===== CUSTOM CURSOR ===== */
#cursor {
    position: fixed;
    width: 40px;
    height: 40px;
    border: 4px solid white;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.7;
    z-index: 9999;
    transition: transform 0.4s ease, opacity 0.4s ease, border-color 1s ease;
}

#cursor.clicking {
    opacity: 0.2;
    transform: scale(0.8);
}

#cursor.moving-fast {
    filter: blur(3px);
}

/* ===== MESSAGE TEXT ===== */
#message {
    font-family: Arial, sans-serif;
    font-size: 28px;
    color: white;
    text-align: center;
    padding: 20px;
    max-width: 80%;
    white-space: pre-wrap;
    transition: color 1s ease, transform 0.3s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.1);
    letter-spacing: 0.5px;
    position: relative;
    z-index: 10;
}

/* ===== MUSIC POPUP ===== */
#music-popup {
    position: fixed;
    top: 20px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    padding: 12px 16px;
    border-radius: 20px;
    opacity: 0;
    transform: translateY(-20px);
    transition: all 0.5s ease;
    z-index: 1000;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
}

#music-popup.active {
    opacity: 1;
    transform: translateY(0);
}

.music-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    object-fit: cover;
    animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

.music-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.music-title {
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    color: white;
}

.music-artist {
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
}

/* ===== MORPHING GRADIENT BLOB ===== */
#gradient-background {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 60vw;
    height: 60vh;
    transform: translate(-50%, -50%);
    z-index: 0;
    background: linear-gradient(135deg, #ff6ec4, #b88af7, #7873f5, #9d6ef5, #ff6ec4);
    background-size: 200% 200%;
    opacity: 0;
    transition: opacity 1s ease, border-radius 8s ease-in-out;
    border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    filter: blur(60px);
    animation: moveGradient 8s ease infinite, morphBlob 10s ease-in-out infinite;
}

@keyframes morphBlob {
    0% {
        border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    }
    25% {
        border-radius: 58% 42% 75% 25% / 76% 46% 54% 24%;
    }
    50% {
        border-radius: 50% 50% 33% 67% / 55% 27% 73% 45%;
    }
    75% {
        border-radius: 33% 67% 58% 42% / 63% 68% 32% 37%;
    }
    100% {
        border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    }
}

#gradient-background::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse 100px 120px at var(--cursor-x, -100px) var(--cursor-y, -100px), 
        transparent 20px, 
        rgba(255,255,255,0.75) 35px,
        rgba(255,255,255,0.95) 55px,
        rgba(255,255,255,0.65) 75px,
        transparent 100px);
    pointer-events: none;
    filter: blur(20px);
    transform: translateX(var(--ripple-x, 0)) translateY(var(--ripple-y, 0));
    transition: none;
    animation: morphDisplacement 8s ease-in-out infinite;
}

@keyframes morphDisplacement {
    0% {
        border-radius: 50%;
    }
    25% {
        border-radius: 45% 55% 60% 40% / 50% 45% 55% 50%;
    }
    50% {
        border-radius: 55% 45% 40% 60% / 45% 60% 40% 55%;
    }
    75% {
        border-radius: 40% 60% 55% 45% / 60% 50% 50% 40%;
    }
    100% {
        border-radius: 50%;
    }
}

@keyframes moveGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

#gradient-background.active {
    opacity: 0.7;
}

/* ===== CREDITS SYSTEM ===== */
#credits-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    z-index: 1;
}

#credits-container::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 25%;
    background: linear-gradient(to bottom, white 0%, rgba(255, 255, 255, 0) 100%);
    z-index: 10;
    pointer-events: none;
}

#credits-container::after {
    content: '';
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 25%;
    background: linear-gradient(to top, white 0%, rgba(255, 255, 255, 0) 100%);
    z-index: 10;
    pointer-events: none;
}

#credits-content {
    transform: translateY(120vh);
    text-align: center;
}

#credits-container.scrolling #credits-content {
    animation: scroll-up-smooth 45s linear forwards; /* Changed from ease-out to linear for consistent speed */
}

@keyframes scroll-up-smooth {
    0% { transform: translateY(120vh); }
    100% { transform: translateY(-100%); }
}

#credits-end-fixed {
    text-align: center;
    margin-top: 150px;
    font-family: 'Georgia', 'Garamond', serif;
    font-size: 48px;
    color: black;
    font-style: italic;
    font-weight: 300;
    text-shadow: 0 2px 20px rgba(255, 110, 196, 0.3), 0 4px 40px rgba(120, 115, 245, 0.2);
    letter-spacing: 2px;
}

.floating-heart {

    z-index: 1;

@keyframes float-up {

    100% {

.heart-wrapper {

.heart {

    height: 60px;

.heart::before,

.heart::after {

@keyframes heartbeat {

function showImage(imageSrc) {
    // Remove existing image if any
    const existingImg = document.getElementById('stage-image');
    if (existingImg) {
        existingImg.remove();
    }
    
    // Create new image element
    const img = document.createElement('img');
    img.id = 'stage-image';
    img.src = imageSrc;
    img.alt = 'Stage Image';
    
    document.body.appendChild(img);
    
    // Calculate position below the message text
    const messageDiv = document.getElementById('message');
    const messageRect = messageDiv.getBoundingClientRect();
    const messageBottom = messageRect.bottom;
    
    // Position image 30px below the message text
    img.style.top = (messageBottom + 30) + 'px';
    
    // Trigger animation after a brief delay
    setTimeout(() => {
        img.classList.add('show');
    }, 100);
}

function hideImage() {
    const img = document.getElementById('stage-image');
    if (img) {
        img.classList.remove('show');
        setTimeout(() => img.remove(), 500);
    }
}

// Example usage in your stages - NEW WAY:

    name: "example_with_image",

const cursor = document.getElementById('cursor');

let mouseX = 0;
let mouseY = 0;
let cursorX = 0;
let cursorY = 0;
let lastMouseX = 0;
let lastMouseY = 0;

const CURSOR_SPEED = 0.1;
const BLUR_THRESHOLD = 200;

document.addEventListener('mousemove', (e) => {
    mouseX = e.pageX - 20;
    mouseY = e.pageY - 20;
});

function animateCursor() {
    const dx = mouseX - lastMouseX;
    const dy = mouseY - lastMouseY;
    const speed = Math.sqrt(dx * dx + dy * dy);
    
    if (speed > BLUR_THRESHOLD) {
        cursor.classList.add('moving-fast');
    } else {
        cursor.classList.remove('moving-fast');
    }

    cursorX += (mouseX - cursorX) * CURSOR_SPEED;
    cursorY += (mouseY - cursorY) * CURSOR_SPEED;

    cursor.style.left = cursorX + 'px';
    cursor.style.top = cursorY + 'px';

    lastMouseX = mouseX;
    lastMouseY = mouseY;

    requestAnimationFrame(animateCursor);
}

document.addEventListener('mousedown', () => {
    cursor.classList.add('clicking');
});

document.addEventListener('mouseup', () => {
    cursor.classList.remove('clicking');
});

animateCursor();

// ========================================
// WATER-LIKE DISPLACEMENT EFFECT
// ========================================
let prevCursorX = 0;
let prevCursorY = 0;
let smoothRippleX = 0;
let smoothRippleY = 0;

function updateBlobMask() {
    const blob = document.getElementById('gradient-background');
    if (!blob) return;
    
    const blobRect = blob.getBoundingClientRect();
    const effectX = cursorX + 20 - blobRect.left;
    const effectY = cursorY + 20 - blobRect.top;
    
    // Calculate velocity for ripple effect
    const velocityX = cursorX - prevCursorX;
    const velocityY = cursorY - prevCursorY;
    
    // Create ripple displacement based on movement direction
    const targetRippleX = -velocityX * 8;
    const targetRippleY = -velocityY * 8;
    
    // Smooth the ripple movement with heavy damping
    smoothRippleX += (targetRippleX - smoothRippleX) * 0.25;
    smoothRippleY += (targetRippleY - smoothRippleY) * 0.25;
    
    blob.style.setProperty('--cursor-x', effectX + 'px');
    blob.style.setProperty('--cursor-y', effectY + 'px');
    blob.style.setProperty('--ripple-x', smoothRippleX + 'px');
    blob.style.setProperty('--ripple-y', smoothRippleY + 'px');
    
    prevCursorX = cursorX;
    prevCursorY = cursorY;
    
    requestAnimationFrame(updateBlobMask);
}

updateBlobMask();

// ========================================
// BLOB DISPLACEMENT ON OTHER ELEMENTS
// ========================================
function applyBlobDisplacement() {
    const blob = document.getElementById('gradient-background');
    const message = document.getElementById('message');
    const hearts = document.querySelectorAll('.floating-heart');
    
    if (!blob || !message) return;
    
    const blobRect = blob.getBoundingClientRect();
    const blobCenterX = blobRect.left + blobRect.width / 2;
    const blobCenterY = blobRect.top + blobRect.height / 2;
    
    // Displace message text
    const msgRect = message.getBoundingClientRect();
    const msgCenterX = msgRect.left + msgRect.width / 2;
    const msgCenterY = msgRect.top + msgRect.height / 2;
    const msgDx = msgCenterX - blobCenterX;
    const msgDy = msgCenterY - blobCenterY;
    const msgDistance = Math.sqrt(msgDx * msgDx + msgDy * msgDy);
    
    if (msgDistance < blobRect.width / 2) {
        const msgDisplacementStrength = 8;
        const msgPushX = (msgDx / msgDistance) * msgDisplacementStrength;
        const msgPushY = (msgDy / msgDistance) * msgDisplacementStrength;
        message.style.transform = `translate(${msgPushX}px, ${msgPushY}px)`;
    } else {
        message.style.transform = 'translate(0, 0)';
    }
    
    // Displace hearts
    hearts.forEach(heart => {
        const heartRect = heart.getBoundingClientRect();
        const heartCenterX = heartRect.left + heartRect.width / 2;
        const heartCenterY = heartRect.top + heartRect.height / 2;
        const heartDx = heartCenterX - blobCenterX;
        const heartDy = heartCenterY - blobCenterY;
        const heartDistance = Math.sqrt(heartDx * heartDx + heartDy * heartDy);
        
        if (heartDistance < blobRect.width / 2) {
            const heartDisplacementStrength = 5;
            const heartPushX = (heartDx / heartDistance) * heartDisplacementStrength;
            const heartPushY = (heartDy / heartDistance) * heartDisplacementStrength;
            heart.style.transform = `translate(${heartPushX}px, ${heartPushY}px)`;
        }
    });
    
    requestAnimationFrame(applyBlobDisplacement);
}

applyBlobDisplacement();

const audioContext = new (window.AudioContext || window.webkitAudioContext)();
const audioSource = audioContext.createMediaElementSource(audio);
const lowPassFilter = audioContext.createBiquadFilter();

lowPassFilter.type = "lowpass";
lowPassFilter.frequency.value = 20000;
audioSource.connect(lowPassFilter);
lowPassFilter.connect(audioContext.destination);

function startMusic() {
    audioContext.resume();
    audio.play();
    musicPopup.classList.add('active');
}

function playVoiceMessage(filename) {
    const voiceAudio = new Audio(filename);
    voiceAudio.play();
    voiceAudio.addEventListener('error', (e) => {
        console.error('Error loading voice message:', filename, e);
    });
}

function duckMusicForVoice() {
    const currentTime = audioContext.currentTime;
    const transitionTime = 0.8;
    audio.volume = 0.3;
    lowPassFilter.frequency.setValueAtTime(lowPassFilter.frequency.value, currentTime);
    lowPassFilter.frequency.linearRampToValueAtTime(300, currentTime + transitionTime);
}

function restoreMusic() {
    const currentTime = audioContext.currentTime;
    const transitionTime = 0.8;
    audio.volume = 1.0;
    lowPassFilter.frequency.setValueAtTime(lowPassFilter.frequency.value, currentTime);
    lowPassFilter.frequency.linearRampToValueAtTime(20000, currentTime + transitionTime);
}

function watchForeverYours() {
    const foreverYours = document.getElementById('credits-end-fixed');
    let hasFixed = false;
    
    function check() {
        if (hasFixed) return;
        
        const rect = foreverYours.getBoundingClientRect();
        const middleOfScreen = window.innerHeight / 2;
        const elementMiddle = rect.top + (rect.height / 2);
        
        // Triggers when the text is 100px away from the center.
        // Moving from center+100px to center.
        if (elementMiddle <= middleOfScreen + 100) {
            hasFixed = true;
            
            const clone = document.createElement('div');
            clone.textContent = foreverYours.textContent;
            
            // Copy exact styles from the original
            const computedStyle = window.getComputedStyle(foreverYours);
            clone.style.fontFamily = computedStyle.fontFamily;
            clone.style.fontSize = computedStyle.fontSize;
            clone.style.color = computedStyle.color;
            clone.style.fontStyle = computedStyle.fontStyle;
            clone.style.fontWeight = computedStyle.fontWeight;
            clone.style.letterSpacing = computedStyle.letterSpacing;
            clone.style.textShadow = computedStyle.textShadow;
            
            // Setup fixed position
            clone.style.position = 'fixed';
            clone.style.left = '50%';
            clone.style.transform = 'translate(-50%, -50%)'; // Centers the element itself
            clone.style.textAlign = 'center';
            clone.style.zIndex = '10000';
            clone.style.margin = '0';
            clone.style.padding = '0';
            clone.style.whiteSpace = 'nowrap';
            
            // STEP 1: Set initial position
            clone.style.top = elementMiddle + 'px';
            
            // STEP 2: Apply the slowing down transition (Easing)
            // Distance = 100px. Initial Speed = 15px/s. 
            // Duration calculation: 2 * distance / initial_speed = 2 * 100 / 15 ≈ 13.3s
            // We use 12s with ease-out to start at approximately the same scrolling speed and decay to 0.
            clone.style.transition = 'top 12s cubic-bezier(0.25, 1, 0.5, 1)';
            
            document.body.appendChild(clone);
            foreverYours.style.visibility = 'hidden';
            
            // Force a reflow
            clone.offsetHeight; 
            
            // STEP 3: Move to the final center position
            clone.style.top = '50%';
            
            return;
        }
        
        requestAnimationFrame(check);
    }
    
    requestAnimationFrame(check);
}

function watchHeartPosition() {
    const heartWrapper = document.querySelector('.heart-wrapper');
    const gradientBg = document.getElementById('gradient-background');
    let blobsStarted = false;
    
    function check() {
        if (blobsStarted) return;
        
        const rect = heartWrapper.getBoundingClientRect();
        const middleOfScreen = window.innerHeight / 2;
        const elementMiddle = rect.top + (rect.height / 2);
        
        if (elementMiddle <= middleOfScreen && elementMiddle >= middleOfScreen - 100) {
            blobsStarted = true;
            gradientBg.classList.add('active');
            startBlobMorphing();
            return;
        }
        
        requestAnimationFrame(check);
    }
    
    requestAnimationFrame(check);
}

function startFloatingHearts() {
    function createHeart() {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.textContent = '♥';
        heart.style.left = Math.random() * 100 + '%';
        heart.style.bottom = '-50px';
        const duration = 8 + Math.random() * 7;
        heart.style.animationDuration = duration + 's';
        const size = 15 + Math.random() * 15;
        heart.style.fontSize = size + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), duration * 1000);
    }
    
    setInterval(createHeart, 400);
}

function startCountUpTimer() {
    const startDate = new Date('2023-10-19');
    
    function updateTimer() {
        const now = new Date();
        const diff = now - startDate;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
        document.getElementById('days-count').textContent = 
            `${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds`;
    }
    
    updateTimer();
    setInterval(updateTimer, 1000);
}

function startBlobMorphing() {
    const blob1 = document.getElementById('blob1');
    const blob2 = document.getElementById('blob2');
    
    function getRandomColor() {
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);
        return `rgb(${r}, ${g}, ${b})`;
    }
    
    function morphBlob(blob) {
        const r1 = Math.floor(Math.random() * 50 + 30);
        const r2 = 100 - r1;
        const r3 = Math.floor(Math.random() * 50 + 30);
        const r4 = 100 - r3;
        const r5 = Math.floor(Math.random() * 50 + 30);
        const r6 = 100 - r5;
        const r7 = Math.floor(Math.random() * 50 + 30);
        const r8 = 100 - r7;
        
        blob.style.borderRadius = `${r1}% ${r2}% ${r3}% ${r4}% / ${r5}% ${r6}% ${r7}% ${r8}%`;
        
        const translateX = (Math.random() - 0.5) * 100;
        const translateY = (Math.random() - 0.5) * 100;
        const rotate = Math.random() * 360;
        const scale = 0.8 + Math.random() * 0.4;
        
        blob.style.transform = `translate(${translateX}px, ${translateY}px) rotate(${rotate}deg) scale(${scale})`;
        
        const nextMorph = 3000 + Math.random() * 2000;
        setTimeout(() => morphBlob(blob), nextMorph);
    }
    
    morphBlob(blob1);
    morphBlob(blob2);
}

            }, 300); // Small delay after text finishes
        }
        
        document.addEventListener('click', nextStage, { once: true });
    }
}

function nextStage() {
    hideImage();
    currentStageIndex++;

    
    if (currentStageIndex < stages.length) {
        startStage(currentStageIndex);
    } else {
        console.log("All stages complete!");
    }
}

function startStage(stageIndex) {
    const stage = stages[stageIndex];
    
    if (stage.onEnter) {
        stage.onEnter();
    }
    
    if (stage.message && stage.message.length > 0) {
        currentChar = 0;
        isTyping = true;
        typeMessage();
    } else {
        isTyping = false;
    }
}

if (DEBUG_MODE) {
    const debugBadge = document.createElement('div');
    debugBadge.style.cssText = `
        position: fixed;
        top: 10px;
        right: 10px;
        background: red;
        color: white;
        padding: 8px 12px;
        border-radius: 5px;
        font-family: monospace;
        font-size: 12px;
        z-index: 99999;
        pointer-events: none;
    `;
    debugBadge.textContent = `🛠 DEBUG: ${DEBUG_STAGE}`;
    document.body.appendChild(debugBadge);
    
    if (DEBUG_STAGE === "credits" || DEBUG_STAGE === "color_change" || DEBUG_STAGE === "final_message") {
        document.body.style.backgroundColor = 'white';
        document.getElementById('message').style.color = 'black';
        cursor.style.borderColor = 'black';
    }
}

document.addEventListener('click', () => {
    if (currentStageIndex === 0 && currentChar === 0) {
        if (DEBUG_MODE) {
            const debugIndex = stages.findIndex(stage => stage.name === DEBUG_STAGE);
            if (debugIndex !== -1) {
                console.log(`🛠 DEBUG MODE: Jumping to stage "${DEBUG_STAGE}" (index ${debugIndex})`);
                currentStageIndex = debugIndex;
                startStage(debugIndex);
            } else {
                console.error(`🛠 DEBUG MODE: Stage "${DEBUG_STAGE}" not found!`);
                startStage(0);
            }
        } else {
            startStage(0);
        }
    }
}, { once: true });
    </script>
</body>
